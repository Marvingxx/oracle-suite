[package]
name = "oracle-suite-ui-egui"
description = "Oracle Suite's egui interface, shared by the desktop and web builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
oracle-style = { path = "../../../oracle-library/style" }
oracle-suite-core = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The OS's preferred UI languages, without spawning `defaults` or `reg.exe`.
sys-locale = "0.3"
# Finding the Simplified Chinese face in a system font collection; egui already uses it.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# The system time zone, so dates read as this computer's calendar; already in the desktop build.
jiff = "0.2"
# The asset library (Library tab): indexing, search, thumbnails. Desktop only (files and threads).
oracle-library-ui = { path = "../../../oracle-library/ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's time zone, for the same dates.
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
